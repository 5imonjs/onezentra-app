name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    name: PHP (tests + style)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, sqlite, curl, dom, xml, tokenizer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Install qpdf
        # PdfCompressor (upload PDF BiayaRetribusi) memanggil binary qpdf;
        # tanpa ini kompresi gagal diam-diam dan test ukuran PDF tidak terpenuhi.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf

      - name: Run tests
        run: php artisan test --compact --exclude-group=performance
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onezentra-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onezentra-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit JS dependencies (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onezentra_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

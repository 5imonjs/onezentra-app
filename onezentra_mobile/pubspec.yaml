name: onezentra_mobile
description: "OneZentra Mobile - Warehouse Management System"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  # Printer thermal label batch.
  #
  # Classic Bluetooth (RFCOMM/SPP), bukan BLE: printer thermal murah (Xprinter,
  # Goojprt, Zjiang, dan sejenisnya) hampir semuanya memakainya. Paket BLE seperti
  # flutter_blue_plus TIDAK akan menemukannya — dan versi 2.x-nya mewajibkan
  # commercial license untuk penggunaan komersial.
  flutter_bluetooth_serial: ^0.4.0
  # Izin runtime Bluetooth Android 12+ (SCAN/CONNECT) untuk cari printer.
  permission_handler: ^13.0.2
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # permission_handler 13.0.2 menarik permission_handler_android 14.1.1 yang
  # mewajibkan AGP 9 + compileSdk 37. Toolchain proyek masih AGP 8.11 /
  # compileSdk 36; 13.0.1 memakai platform interface yang sama dan tetap
  # kompatibel untuk izin Bluetooth yang dipakai aplikasi.
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Font Roboto & Roboto Mono di-bundle agar app tidak mengambil font dari
    # internet saat runtime (offline-first, ukuran & startup lebih pasti).
    - assets/google_fonts/
    # Dibaca rootBundle untuk mengetahui versi terinstal (pengganti
    # package_info_plus) — bundel yang sama, tanpa plugin tambahan.
    - pubspec.yaml

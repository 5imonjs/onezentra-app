name: onezentra_mobile
description: "OneZentra Mobile - Warehouse Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  intl: ^0.19.0
  mobile_scanner: ^7.4.2
  # Printer thermal label batch.
  #
  # Classic Bluetooth (RFCOMM/SPP), bukan BLE: printer thermal murah (Xprinter,
  # Goojprt, Zjiang, dan sejenisnya) hampir semuanya memakainya. Paket BLE seperti
  # flutter_blue_plus TIDAK akan menemukannya — dan versi 2.x-nya mewajibkan
  # commercial license untuk penggunaan komersial.
  flutter_bluetooth_serial: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/